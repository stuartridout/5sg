<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A16" media="(prefers-color-scheme: dark)">
<title>Welcome Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500;9..144,600;9..144,700,100&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root{
    --bg:#F4F7F2; --surface:#FFFFFF; --surface-2:#E9F0E6; --ink:#1B2620; --muted:#5B6A61; --line:#D9E2D8;
    --accent:#2E7D5B; --accent-ink:#1F5C42; --accent-soft:#DDEFE4; --on-accent:#FFFFFF;
    --honey:#E8A33A; --honey-soft:#FBEFD9; --honey-ink:#7A4A10;
    --bad:#B3261E; --bin-blue:#3D6FB8; --bin-red:#C8403E;
    --shadow:0 10px 30px rgba(27,38,32,.08);
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --body:"Nunito",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141A16; --surface:#1D2520; --surface-2:#243029; --ink:#E8EEE9; --muted:#A3B0A8; --line:#2F3B34;
      --accent:#6FC99A; --accent-ink:#8FDBB2; --accent-soft:#1F3A2E; --on-accent:#0F1A14;
      --honey:#F0B85C; --honey-soft:#3A2F1A; --honey-ink:#F5D9A6;
      --bad:#F2A59E; --bin-blue:#4A7FCB; --bin-red:#D24C4A;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
  a{color:var(--accent-ink)}
  #gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 24px;max-width:420px;width:100%;box-shadow:var(--shadow)}
  .mark{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .mark svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .box h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}
  .box p{margin:0 0 20px;color:var(--muted)}
  label{display:block;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  input{width:100%;font:inherit;font-size:18px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
  input:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
  button{margin-top:12px;width:100%;min-height:52px;font:inherit;font-weight:800;font-size:17px;padding:13px 16px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);cursor:pointer;transition:transform .12s ease,filter .12s ease}
  button:hover{filter:brightness(1.06)} button:active{transform:scale(.985)}
  button:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:var(--bad);font-size:15px;font-weight:600;margin:12px 0 0;min-height:1.4em}
  #content{display:none}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="gate">
  <form class="box" id="form" autocomplete="off">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></div>
    <h1>Hello, and welcome home.</h1>
    <p>This little manual is just for you. Pop in the password you were given and everything about the house is inside.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    <button id="go" type="submit">Open the manual</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="content"></div>

  var form = document.getElementById('form'), pw = document.getElementById('pw'),
      err = document.getElementById('err'), go = document.getElementById('go');

  function b64(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }

  async function decrypt(password){
    var enc = new TextEncoder();
    var keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iterations, hash:'SHA-256'},
      keyMaterial, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.data));
    return new TextDecoder().decode(plain);
  }

  function reveal(html){
    var c = document.getElementById('content');
    document.getElementById('gate').remove();
    c.style.display = 'block';
    c.innerHTML = html;
    c.querySelectorAll('script').forEach(function(old){
      var s = document.createElement('script'); s.textContent = old.textContent; old.replaceWith(s);
    });
    if (location.hash) { var t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
  }

  async function attempt(password, quiet){
    go.disabled = true; err.textContent = '';
    try {
      var html = await decrypt(password);
      try { sessionStorage.setItem('manual-pw', password); } catch(e){}
      reveal(html);
    } catch(e) {
      if (!quiet) { err.textContent = "That's not it. Check the password and try again."; pw.select(); }
    } finally { go.disabled = false; }
  }

  form.addEventListener('submit', function(ev){ ev.preventDefault(); attempt(pw.value, false); });

  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'This page needs a modern browser over https to open.';
  } else {
    try { var saved = sessionStorage.getItem('manual-pw'); if (saved) attempt(saved, true); } catch(e){}
  }
})();
